version: "3.9"

services:
    app_backend:
        container_name: ${APP_CONTAINER_NAME}
        hostname: ${APP_HOSTNAME}
        restart: always
        working_dir: ${SRC_PATH}
        build:
            context: .
            dockerfile: php/development/Dockerfile
            args:
                - "UID"
                - "GID"
                - "USER_NAME"
                - "SRC_PATH"
        environment:
            UID: ${UID}
            GID: ${GID}
            USER_NAME: ${USER_NAME}
            RDMS_DB_NAME: ${RDMS_DB_NAME}
            RDMS_DB_PASSWORD: ${RDMS_DB_PASSWORD}
            RDMS_DB_USER: ${RDMS_DB_USER}
            DATABASE_URL: "postgresql://${RDMS_DB_USER}:${RDMS_DB_PASSWORD}@${RDMS_HOSTNAME}:5432/${RDMS_DB_NAME}?serverVersion=17&charset=utf8"
            REDIS_DSN: "redis://${CACHE_HOSTNAME}:6379"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - database
        volumes:
            - ../app:${SRC_PATH}
            - ./php/development/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
            - ./php/development/date.ini:/usr/local/etc/php/conf.d/date.ini
            - ./php/development/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

    nginx:
        container_name: ${NGINX_CONTAINER_NAME}
        hostname: ${NGINX_HOSTNAME}
        build:
            context: .
            dockerfile: nginx/Dockerfile
            args:
                - "DOMAIN"
                - "SRC_PATH"
                - "PUBLIC_PATH"
        depends_on:
            - app_backend
        volumes:
            - ../app:${SRC_PATH}
        ports:
            - "80:80"

    database:
        container_name: ${RDMS_CONTAINER_NAME}
        hostname: ${RDMS_HOSTNAME}
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${RDMS_DB_NAME}
            POSTGRES_PASSWORD: ${RDMS_DB_PASSWORD}
            POSTGRES_USER: ${RDMS_DB_USER}
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${RDMS_DB_NAME}", "-U", "${RDMS_DB_USER}"]
            timeout: 5s
            retries: 5
            start_period: 60s
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    mailer:
        container_name: ${MAILER_CONTAINER_NAME}
        hostname: ${MAILER_HOSTNAME}
        image: axllent/mailpit
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    cache:
        container_name: ${CACHE_CONTAINER_NAME}
        hostname: ${CACHE_HOSTNAME}
        image: redis:8-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

volumes:
    postgres_data:
    redis_data:
